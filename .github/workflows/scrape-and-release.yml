name: Atualizar Schemas e Criar Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scrape-and-release.yml"
      - "schemas/v4/**"
  schedule:
    # Segunda-feira as 03:00 UTC, 00:00 em America/Sao_Paulo.
    - cron: "0 3 * * 1"

jobs:
  build-and-release:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"
          cache: true

      - name: Instalar Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Rodar scraper
        run: |
          go mod tidy
          go build -o scraper main.go
          ./scraper

      - name: Checar mudancas nos schemas
        id: git-check
        run: |
          if git diff --quiet -- 'schemas/v4/*.xsd'; then
            echo "Sem mudancas nos schemas."
            echo "changes-found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Mudancas detectadas nos schemas."
            echo "changes-found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Commitar schemas atualizados
        if: steps.git-check.outputs.changes-found == 'true'
        run: |
          git add schemas/v4/*.xsd
          git commit -m "chore(schemas): atualiza schemas XSD da SEFAZ"
          git push

      - name: Registrar checagem sem mudanca
        if: steps.git-check.outputs.changes-found == 'false' && github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-scrape-check.txt
          git add .github/last-scrape-check.txt
          git commit -m "chore(actions): registra checagem semanal da SEFAZ"
          git push

      - name: Criar tag de release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.git-check.outputs.changes-found == 'true'
        id: tagger
        run: |
          if [ "${{ steps.git-check.outputs.changes-found }}" = "true" ]; then
            TAG_NAME="v$(date -u +'%Y.%m.%d-%H%M')"
          else
            TAG_NAME="v${{ github.run_id }}-${{ github.event_name }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Zipar schemas
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.git-check.outputs.changes-found == 'true'
        run: |
          zip -r schemas-v4-latest.zip ./schemas/v4

      - name: Criar release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || steps.git-check.outputs.changes-found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.tag }}
          name: "Schemas NF-e/NFC-e (Auto-atualizado)"
          body: "Atualizacao automatica dos schemas XSD da SEFAZ. Este release contem a pasta schemas/v4 com todos os arquivos .xsd mais recentes."
          files: |
            schemas-v4-latest.zip
